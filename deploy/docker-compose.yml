services:
  ikuai-aio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/nervebing/ikuai-aio:v4
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
